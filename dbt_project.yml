name: 'my_new_project'
version: '1.0.0'
config-version: 2

profile: 'default'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"

clean-targets:
  - "target"
  - "dbt_packages"

models:
  my_new_project:
    stage:
      +materialized: view
      postgres:
        +materialized: view
        +database: raw
        +schema: postgres_raw

    intermediate:
      +materialized: view
      postgres:
        +materialized: view
        +database: prod
        +schema: intermediate

    marts:
      +materialized: table
      postgres:
        +materialized: table
        +database: prod
        +schema: dim

    reporting:
      +materialized: view
      postgres:
        +materialized: view
        +database: prod
        +schema: data_store

data_tests:
  my_new_project:
    postgres:
      Non_Negative_Order_Quantity:
        +severity: error
        +store_failures: true

on-run-start:
  - "{{ audit('RUN_STARTED', 'ALL_SELECTED_MODELS') }}"

on-run-end:
  - "{{ audit('RUN_ENDED', 'ALL_SELECTED_MODELS') }}"